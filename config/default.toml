# 默认配置，所有默认值都在这里。
# 其他配置文件只写要改的项，叠加在这份之上：membench demo --config config/hard.toml
#
# 世界由三条规则生成：补给、指代、转述。旋钮只管「多常、多远、多绕」。

# ── 记忆旋钮（常调）：考多少记忆、考多远、考多绕 ───────────────────
[memory]
recall = 0.3      # 指代：一个人另要一个以前听过的旧词的概率
decay = 1.0       #       旧词越久远越难被翻出来：每被用过一次攒一份机会，k 章前的那份按 k^(-decay) 衰减
                  #       0 = 只看用过几次；越大越偏向最近（≥3 时几乎只翻上一章）
indirect = 0.3    #       提到一个词或一个人时，不直说、再绕一步的概率（多跳长度由它自然决定）
relay = 0.3       # 转述：一个人要什么，由别人代说的概率
revise = 0.15     #       有人来改口的概率（改完还可能再改）

# ── 骨架旋钮（结构）：世界的形状，定好后基本不用动 ─────────────────
[structure]
size = 5          # 补给：一片区域的骨架人数
depth = 1         #       区域最多嵌套几层
ramp = 5          # 爬坡：前 ramp 章里，旧词、绕弯、代说、改口从 0 逐渐升到上面的值；0 = 一开始就满

# ── 运行 ────────────────────────────────────────────────────────
[run]
seed = 0
T = 1000                            # 一局的步数上限
strikes = 3                         # 说错几次就被抓、一局结束；0 = 不限
setting = "settings/heishui.toml"   # 世界观

# ── 润色：只改说法，不改内容，不影响分数 ───────────────────────────
[skin]
llm = false                             # 也可以用命令行 --llm 打开
base_url = "https://api.deepseek.com"   # 任何兼容 OpenAI chat/completions 的服务
model = "deepseek-chat"
api_key_env = "DEEPSEEK_API_KEY"        # 从环境变量或 .env 读取（项目目录或上一级）
cache = "cache/skin.json"
