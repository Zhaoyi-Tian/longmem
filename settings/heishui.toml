# 世界观《黑水渡》
#
# 世界观只决定「怎么说」，不决定「是什么」：规则、依赖和分数都与它无关。
# 换一个世界观，就是换一份这样的文件。所有词库都可以无限组合下去（见 [names] 的 grow）。

name = "黑水渡"

# 给润色 LLM 的背景
background = """
黑水河在这里拐了个弯，渡口、赌坊、义庄、当铺挤在一片终年不散的雾里。白天归官府，夜里归刀子。
三天前的夜里，城南盐商沈家七口一夜死绝，宅子连同账本烧成了白地。
你是打更的，那夜你是唯一看清凶手的人。没人信你看见了什么，倒是人人都想让你闭嘴。
镇上见不得光的人只用切口说话：一句切口换一条路，说错了，就别想走出这条街。
雾里永远还有下一条街。天亮之前，你得一街一街地逃下去。
"""

# 给润色 LLM 的文风
tone = "冷峻、简短、压低声音的江湖口吻。可以写雾、雨、灯笼、刀光、火光、血腥气，点到为止，不写血腥细节。"

# 给 agent 的开场白（规则说明由程序附在后面，所有世界观都一样）
intro = "月黑风高。你是黑水渡的更夫，那夜你看见了灭门案的凶手。现在整个镇子都在找你。"

# 切口（⟨⟩ 里的无意义词）由这些字随机拼成，2～3 字，用尽后自动加长
syllables = "瓢拐溜翻窑盘扯呼漂蘑菇妖盖嘛哈哩咯嗦喳嗬咚锵啷叮咣喏呗嘞嚓噶咩乜唦吽唵叭咪吡嗡哆嘁嗤咻嘀嗒啪嚯咿呀"

# 人在一片地方里站的位置，只是点缀
spots = ["檐下", "井边", "桥洞下", "门槛上", "灯笼下", "墙角", "柴堆旁", "灶台边", "棺材旁",
         "牌坊下", "水缸后", "戏台边", "赌桌前", "柜台后", "码头", "石狮子旁"]

# 身份 = 人设。身份同时是命名用的 {role} 槽位
[roles]
"刀客" = "话少，句句带刀"
"仵作" = "见惯死人，说话慢条斯理"
"赌徒" = "两眼通红，三句不离骰子"
"私盐贩子" = "精明，压价，一身咸腥"
"牙婆" = "嘴甜心狠，什么都能卖"
"乞丐" = "装疯卖傻，其实什么都知道"
"捕快" = "一口官腔，心虚，收过不该收的钱"
"戏子" = "一开口就像在唱戏"
"棺材铺掌柜" = "笑眯眯地打量你的身量"
"和尚" = "满嘴佛号，袖里藏刀"
"郎中" = "一身药味，说话像开方子"
"船娘" = "泼辣，嗓门大"
"酒保" = "擦着杯子，什么都听见过"
"当铺朝奉" = "冷眼估价，一字千金"
"寡妇" = "一身孝，说话带刺"
"说书人" = "爱卖关子"
"算命先生" = "神神叨叨，话里有话"
"屠夫" = "粗声大气，一身血腥气"
"账房先生" = "拨着算盘，句句算计"
"渔夫" = "沉默寡言，满身水腥"
"小乞儿" = "怯生生，却机灵"
"货郎" = "吆喝惯了，话又多又快"
"黑衣人" = "看不清脸，声音很低"
"老鸨" = "笑里藏针"

[slots]
color = ["黑", "白", "灰", "青", "赭", "绛", "褐", "墨", "素", "绿", "黄", "紫", "红"]
garment = ["斗笠", "蓑衣", "面巾", "短打", "长衫", "披风", "头巾", "皮袄", "孝服", "围裙",
           "毡帽", "油伞", "灯笼", "布袋", "草鞋", "腰带"]
mark = ["独眼", "缺了左耳", "脸上带疤", "瘸腿", "断了一指", "一身酒气", "满手墨迹", "驼背",
        "光头", "络腮胡", "腕上缠红绳", "浑身湿透", "嗓子沙哑", "戴铜戒指"]
head = ["黑", "白", "乱", "枯", "断", "鬼", "血", "野", "寒", "荒", "沉", "冷", "孤", "残",
        "阴", "雾", "鸦", "骨", "灰", "铁"]
tail = ["水", "石", "柳", "坟", "灯", "井", "桥", "松", "霜", "河", "狗", "马", "钱", "火", "刀", "槐"]
town = ["渡", "街", "巷", "镇", "市", "坡", "集", "埠"]
den = ["赌坊", "义庄", "当铺", "祠堂", "地窖", "柴房", "酒窖", "戏台", "后院", "暗室", "茶楼", "染坊"]

# 命名：随机挑一个 pattern 填槽；组合用尽时，用 grow 在已有名字上再叠一层，所以名字永远用不完
[names.look]                       # 人的称呼，必须以 {role} 结尾（润色时据此找人设）
patterns = ["{color}{garment}的{role}", "{mark}的{role}", "{mark}、{color}{garment}的{role}"]
grow = "{mark}、{base}"
[names.outer]                      # 一章（一条街）
patterns = ["{head}{tail}{town}"]
grow = "{head}{base}"
[names.inner]                      # 街里的一处地方
patterns = ["{head}{tail}{den}"]
grow = "{head}{base}"

# 指代：沿一跳关系提到一个词或一个人，{x} 是关系另一端
[terms]
gift = "{x}给你的那句切口"
want = "{x}要的那句切口"
giver = "给你{x}的那位"
wanter = "讨{x}的那位"
teller = "替{x}传话的那位"
target = "{x}替他传话的那位"
quote = "「{x}」"                  # 嵌套时给内层加引号
join = "和"

[scene]
here = "〔{region}〕雾里有：{here}"
at = "你在{at}身边。"
alone = "你身边没有人。"
steps = "（第 {t}/{T} 步{left}）"
left = "，还能说错 {left} 次"

# 台词：每类事件若干种说法，随机挑一种。可用字段见各行
[lines]
begin = ["梆——三更。你缩在{region}的屋檐下，雾里全是人影。",
         "身后的天边还烧着火光。你逃进了{region}。"]
meet = ["你凑到{who}跟前。", "你压低斗笠，挨近{who}。", "你穿过雾，走向{who}。"]
quiet = ["{who}别过脸去，不再说话。", "{who}像没看见你一样。", "{who}说过的话，不会说第二遍。"]
silent = ["{who}盯着你，一言不发。", "{who}把手按在刀柄上，什么也没说。", "{who}只是看着你，像在等一句话。"]
give = ["{who}压低声音：「⟨{word}⟩。」", "{who}在你手心里写下：⟨{word}⟩。",
        "{who}凑到你耳边：「记住，⟨{word}⟩。」", "{who}吐出一句切口：⟨{word}⟩。"]
accept = ["{who}的眼神松了下来。", "{who}点了点头。"]
partial = ["{who}点点头：「还差。」", "{who}没动：「不止这一句。」"]
reject = ["{who}冷笑一声：「不对。」", "{who}摇了摇头。", "{who}的手摸向了刀柄——不对。"]
premature = ["{who}打量了你一眼：「那句切口，你还没拿到。」", "{who}嗤笑：「先去把那句拿到手再来。」"]
caught = ["{who}一声唿哨，暗处的人围了上来。你被抓住了。"]
ignore = ["{who}没理你。"]
void = ["你对着雾说了一句，只有风声。"]
nobody = ["雾里没有「{name}」这个人。"]
unknown = ["这里只能做两件事：走 <编号或称呼>，说 <切口>。"]
enter = ["{who}侧身让开。你钻进了{region}。", "{who}推开一扇暗门。你进了{region}。"]
leave = ["你从{region}出来，回到{to}。"]
next = ["{who}让开了路。你逃出{from}，一头扎进{to}的雾里。",
        "{who}挥了挥手。{from}被甩在身后，前面是{to}。"]
ask_self = ["{who}低声说：「要过去，先说{terms}。」", "{who}：「拿{terms}来换。」",
            "{who}眯起眼：「{terms}。说不出来，就滚。」"]
ask_other = ["{who}低声说：「{target}认的是{terms}。」", "{who}拉住你：「去见{target}，说{terms}。」",
             "{who}朝暗处努努嘴：「{target}只认{terms}。」"]
ask_revised = ["{who}说：「{target}改了主意，现在只认{terms}。」",
               "{who}压低声音：「{target}托我带话——之前那句作废，改成{terms}。」"]
